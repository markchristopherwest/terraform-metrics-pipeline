# Loki 3.x single-binary, filesystem storage, 30-day retention.
# Verify with: docker run --rm -v $PWD/loki:/cfg grafana/loki:3.7.6 -config.file=/cfg/loki-config.yml -verify-config=true
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-shipper-active
    cache_location: /loki/tsdb-shipper-cache

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 50
  delete_request_store: filesystem

limits_config:
  allow_structured_metadata: true     # the promtail/alloy pipelines attach entity/change/cloud_type as metadata
  retention_period: 720h              # 30 days of snapshots; raise for longer churn analysis
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 16MB
  max_line_size: 4MB                  # the summary line can be large on big tenants
  max_query_series: 5000
  max_query_length: 0h                # unlimited
  query_timeout: 2m
  split_queries_by_interval: 1h
  volume_enabled: true
  discover_service_name: []           # keep the stream label set to job/report/tenant/source

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

ruler:
  alertmanager_url: http://localhost:9093

analytics:
  reporting_enabled: false
