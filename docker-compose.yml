# Prisma Cloud tenant telemetry: Terraform (every 5 min) -> ./reports/*.json
#   -> metrics_scraper (Prometheus) + Promtail/Alloy (Loki) -> Grafana dashboards
#
#   cp .env.example .env && $EDITOR .env     # PRISMACLOUD_* credentials
#   docker compose up -d --build             # real tenant
#   TF_MODULE=terraform-mock docker compose up -d --build   # no tenant needed (demo data)
#   docker compose --profile alloy up -d     # use Grafana Alloy instead of (EOL) Promtail
#
# Grafana http://localhost:3000  Prometheus :9090  Loki :3100  scraper :9464/metrics  Promtail :9080

name: prisma-cloud-telemetry

x-restart: &restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------- producers
  terraform-runner:
    build: ./scheduler
    <<: *restart
    env_file:
      - path: .env
        required: false            # not needed for TF_MODULE=terraform-mock
    environment:
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-300}
      TF_PARALLELISM: ${TF_PARALLELISM:-3}
      TENANT_LABEL: ${TENANT_LABEL:-prisma-cloud}
      API_ENRICHMENT: ${API_ENRICHMENT:-true}
      PSEUDONYMIZE_USERS: ${PSEUDONYMIZE_USERS:-false}
      TF_DIR: /terraform
      REPORTS_DIR: /reports
      STATE_DIR: /var/lib/prisma-reports
      TF_PLUGIN_CACHE_DIR: /var/cache/terraform-plugins
    volumes:
      - ./${TF_MODULE:-terraform}:/terraform       # rw: terraform writes .terraform.lock.hcl here
      - ./reports:/reports
      - tf-state:/var/lib/prisma-reports
      - tf-plugin-cache:/var/cache/terraform-plugins
    stop_grace_period: 2m

  metrics-scraper:
    build: ./scraper
    <<: *restart
    environment:
      REPORTS_DIR: /reports
      PORT: "9464"
      SCAN_INTERVAL: "5"
      STALE_AFTER_SECONDS: "900"
      WRITE_CHANGES: "true"
      ENTITY_METRICS: "true"
      USER_METRICS: ${USER_METRICS:-true}
      MAX_ENTITY_SERIES: "5000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./reports:/reports
    ports:
      - "9464:9464"

  # ---------------------------------------------------------------- log shipping
  promtail:
    image: grafana/promtail:3.6.11          # last Promtail release (EOL 2026-03-02); see alloy profile
    <<: *restart
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./reports:/reports:ro
    ports:
      - "9080:9080"
    depends_on:
      - loki

  alloy:
    image: grafana/alloy:v1.18.1
    <<: *restart
    profiles: ["alloy"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./reports:/reports:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "12345:12345"
    depends_on:
      - loki

  # ---------------------------------------------------------------- storage
  loki-init:
    image: busybox:1.37
    command: ["sh", "-c", "mkdir -p /loki/chunks /loki/rules /loki/compactor /loki/tsdb-shipper-active /loki/tsdb-shipper-cache && chown -R 10001:10001 /loki"]
    volumes:
      - loki-data:/loki

  loki:
    image: grafana/loki:3.7.6
    <<: *restart
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    depends_on:
      loki-init:
        condition: service_completed_successfully
    # no healthcheck: the image is distroless (no shell/wget). Promtail/Alloy retry
    # pushes with back-off until Loki answers /ready.

  prometheus:
    image: prom/prometheus:v3.14.0
    <<: *restart
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-180d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prom-data:/prometheus
    ports:
      - "9090:9090"

  # ---------------------------------------------------------------- UI
  grafana:
    image: grafana/grafana:13.2.0
    <<: *restart
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/prisma-churn.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  tf-state:
  tf-plugin-cache:
  loki-data:
  alloy-data:
  prom-data:
  grafana-data:
